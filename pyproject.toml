[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translator"
version = "0.1.0"
description = "Local PDF to readable Markdown and plain text conversion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11.9,<0.12"]

[project.optional-dependencies]
translation = ["google-genai>=2.31,<3", "markdown-it-py>=3,<5", "tzdata>=2025.2"]
dev = ["reportlab>=4,<5", "google-genai>=2.31,<3", "markdown-it-py>=3,<5", "tzdata>=2025.2"]

[project.scripts]
pdf-translator = "pdf_translator.cli:main"
pdf-translate = "pdf_translator.translation.cli:main"

[tool.setuptools.packages.find]
include = ["pdf_translator*"]
